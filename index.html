<!DOCTYPE html>
<html lang="en" data-theme="red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIFI Mod Points Planner</title>
<link rel="icon" href="ModPoints.png" type="image/png">
<script>
(function () {
  if (location.search.indexOf("fresh=") !== -1) {
    history.replaceState(null, "", location.pathname + location.hash);
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (reg) { reg.unregister(); });
    });
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function (keys) {
      keys.forEach(function (key) { caches.delete(key); });
    });
  }
  var version = Date.now();
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "styles.css?v=" + version;
  document.head.appendChild(link);
  try {
    var savedTheme = JSON.parse(localStorage.getItem("cifi-mtc-planner-v1") || "null");
    var themeName = savedTheme && savedTheme.theme;
    if (themeName === "green" || themeName === "charcoal" || themeName === "light" || themeName === "red") {
      document.documentElement.setAttribute("data-theme", themeName);
    }
  } catch (err) {}
  window.__assetVersion = version;
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button type="button" class="brand" data-go="home" aria-label="Home">
      <img src="ModPoints.png" alt="" width="28" height="28">
      <span class="brand-text">
        <b>Mod Points Planner</b>
        <small>CIFI · Based on Mod Tree Cultivator v1.2.0.11</small>
      </span>
    </button>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="home" class="tab">Home</button>
      <button type="button" data-tab="plan" class="tab">Buy order</button>
      <button type="button" data-tab="levels" class="tab">Owned levels</button>
      <button type="button" data-tab="settings" class="tab">Weights and progress</button>
      <button type="button" data-tab="map" class="tab">Map</button>
    </nav>
    <div class="config">
      <button type="button" class="gear" id="config-btn" aria-label="Configurations" aria-expanded="false" aria-controls="config-menu">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.14.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.49.4 1.04.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.22 1.14-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
        </svg>
      </button>
      <div class="config-menu" id="config-menu" hidden>
        <h2>Configurations</h2>
        <div class="config-cols">
          <div class="config-col">
            <p class="config-label">Theme</p>
            <div class="theme-choices" role="radiogroup" aria-label="Theme">
              <button type="button" class="theme-choice" role="radio" data-theme-pick="green" aria-checked="false">
                <span class="swatch" aria-hidden="true"><i style="background:#0f130e"></i><i style="background:#1c2519"></i><i style="background:#e2a53a"></i></span>
                Dark green
              </button>
              <button type="button" class="theme-choice" role="radio" data-theme-pick="charcoal" aria-checked="false">
                <span class="swatch" aria-hidden="true"><i style="background:#141413"></i><i style="background:#242422"></i><i style="background:#e2a53a"></i></span>
                Charcoal
              </button>
              <button type="button" class="theme-choice" role="radio" data-theme-pick="light" aria-checked="false">
                <span class="swatch" aria-hidden="true"><i style="background:#f3f1ec"></i><i style="background:#fff"></i><i style="background:#e2a53a"></i></span>
                Light
              </button>
              <button type="button" class="theme-choice" role="radio" data-theme-pick="red" aria-checked="false">
                <span class="swatch" aria-hidden="true"><i style="background:#141413"></i><i style="background:#242422"></i><i style="background:#e24b3a"></i></span>
                Red
              </button>
            </div>
          </div>
          <div class="config-col">
            <p class="config-label">Costs</p>
            <div class="theme-choices" role="radiogroup" aria-label="Costs">
              <button type="button" class="theme-choice" role="radio" data-cost-pick="suffix" aria-checked="false">
                Suffixes <span class="config-example">2.50m</span>
              </button>
              <button type="button" class="theme-choice" role="radio" data-cost-pick="sci" aria-checked="false">
                Scientific <span class="config-example">2.50e6</span>
              </button>
            </div>
            <p class="config-label">Mini-map</p>
            <label class="config-check"><input type="checkbox" id="show-minimap" checked> Show mini-map</label>
            <div class="theme-choices" id="minimap-place" role="radiogroup" aria-label="Mini-map position">
              <button type="button" class="theme-choice" role="radio" data-map-place="card" aria-checked="false">Next purchase</button>
              <button type="button" class="theme-choice" role="radio" data-map-place="side" aria-checked="true">Left of the list</button>
            </div>
          </div>
          <div class="config-col">
            <p class="config-label">UI</p>
            <label class="config-check"><input type="checkbox" id="compact-lists"> Tighter lists</label>
            <p class="config-label">Show what each mod does</p>
            <label class="config-check config-sub"><input type="checkbox" id="effects-order"> Buy order</label>
            <label class="config-check config-sub"><input type="checkbox" id="effects-levels"> Owned levels</label>
            <label class="config-check config-sub"><input type="checkbox" id="effects-map" checked> Map</label>
          </div>
          <div class="config-col">
            <p class="config-label">Data</p>
            <button type="button" class="btn ghost small-btn" id="config-backup-save">Download backup</button>
            <button type="button" class="btn ghost small-btn" id="config-backup-load">Load backup</button>
            <button type="button" class="btn ghost danger small-btn" id="config-delete-data">Delete all data</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<input type="file" id="backup-file" accept=".json,application/json" hidden>
<main id="app"></main>
<script>
["data.js", "engine.js", "effects.js", "app.js"].forEach(function (file) {
  var script = document.createElement("script");
  script.src = file + "?v=" + window.__assetVersion;
  script.async = false;
  document.body.appendChild(script);
});
</script>
</body>
</html>
